<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>揺れ YURE · the planet, played live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <header class="top">
      <div class="brand">
        <span class="brand-kanji">揺れ</span>
        <span class="brand-name">YURE</span>
      </div>
      <p class="status"><span class="status-dot"></span><span id="statusText">Connecting...</span></p>
    </header>

    <h1 class="headline" id="headline">Listening for the Earth...</h1>

    <div class="controls">
      <button class="btn btn-dark" id="listenBtn">Listen</button>
      <button class="btn" id="playBtn">▶ Replay</button>
      <div class="tabs" id="windowBtns">
        <button data-window="hour">Hour</button>
        <button data-window="day" class="active">Day</button>
        <button data-window="week">Week</button>
      </div>
    </div>

    <div class="stage">
      <img src="assets/world-map.svg" alt="" class="map-img">
      <canvas id="map"></canvas>
      <div class="card" id="card"></div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="legend">
      <span><i style="background:#d23f2a"></i>shallow</span>
      <span><i style="background:#c98a1b"></i>middle</span>
      <span><i style="background:#24447a"></i>deep</span>
      <span class="legend-size">bigger circle = stronger quake</span>
    </div>

    <h2 class="list-title">Latest</h2>
    <ol class="list" id="list"></ol>

    <footer class="foot">
      Live data from the <a href="https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php" target="_blank">USGS</a>, checked every minute 
    </footer>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
